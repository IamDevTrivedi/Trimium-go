# Air configuration for Trimium-go server
# Reference: https://github.com/air-verse/air

root = "."
testdata_dir = "testdata"
tmp_dir = "tmp"

[build]
  # Build command pointing to the application entrypoint
  cmd = "go build -o ./tmp/api ./cmd/api"

  # Binary executed by air (modern Air entrypoint setting)
  entrypoint = ["./tmp/api"]

  # Run binary with development environment variables
  full_bin = "APP_ENV=development ./tmp/api"

  # Watch file extensions
  include_ext = ["go", "tpl", "tmpl", "html"]

  # Watch specific config files
  include_file = [".env.development"]

  # Exclude directories from watching
  exclude_dir = ["assets", "tmp", "vendor", "testdata", "bin"]

  # Exclude test files from triggering rebuilds
  exclude_regex = ["_test\\.go$"]

  # Exclude unchanged files
  exclude_unchanged = false

  # Wait duration in ms after a file change before triggering build
  delay = 500

  # Stop previous binary if build fails
  stop_on_error = true

  # Send SIGINT first to allow graceful shutdown before killing the process
  send_interrupt = true
  kill_delay = "500ms"

  # Do not automatically rerun exited binaries
  rerun = false

[color]
  main = "magenta"
  watcher = "cyan"
  build = "yellow"
  runner = "green"

[log]
  time = false
  main_only = false
  silent = false

[misc]
  # Clean up tmp directory on exit
  clean_on_exit = true

[screen]
  clear_on_rebuild = false
  keep_scroll = true
