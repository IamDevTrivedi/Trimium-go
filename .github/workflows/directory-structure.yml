name: Update Directory Structure

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-directory-structure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install tree
        run: |
          sudo apt-get update
          sudo apt-get install -y tree

      - name: Generate directory structure
        run: |
          mkdir -p docs
          tree -a -I .git > docs/DIRECTORY_STRUCTURE.txt

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/DIRECTORY_STRUCTURE.txt
          if git diff --staged --quiet; then
            echo "No changes in directory structure."
          else
            git commit -m "chore(docs): update directory structure [skip ci]"
            git push
          fi
